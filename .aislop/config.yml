version: 1
engines:
  format: true
  lint: true
  code-quality: true
  ai-slop: true
  architecture: true
  security: true
quality:
  maxFunctionLoc: 80
  maxFileLoc: 400
  maxNesting: 5
  maxParams: 6
lint:
  typecheck: true
  expoDoctor: false
security:
  audit: true
  auditTimeout: 25000
scoring:
  weights:
    format: 0.3
    lint: 0.6
    code-quality: 0.8
    ai-slop: 1
    architecture: 1
    security: 1.5
  thresholds:
    good: 75
    ok: 50
  smoothing: 5
  maxPerRule: 40
ci:
  failBelow: 85
  format: json
rules:
  security/dangerously-set-innerhtml: off
  jsx-a11y/click-events-have-key-events: off
  jsx-a11y/prefer-tag-over-role: off
  jsx-a11y/no-noninteractive-element-interactions: off
  jsx-a11y/no-static-element-interactions: off
  jsx-a11y/label-has-associated-control: off
  jsx-a11y/control-has-associated-label: off
  jsx-a11y/label-has-accessible-text: off
  complexity/function-too-long: off
  complexity/file-too-large: off
  complexity/deep-nesting: off
  code-quality/duplicate-block: off
  eslint/no-empty: off
  ai-slop/double-type-assertion: off
  ai-slop/hardcoded-url: off
  ai-slop/any-cast: off
  ai-slop/unsafe-type-assertion: off
  react/purity: off
exclude:
  - "node_modules"
  - ".git"
  - ".next"
  - "dist"
  - "build"
  - "coverage"
  - "scripts"
  - "docs"
